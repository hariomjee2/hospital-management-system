services:
  - type: web
    name: hms-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/v1/lab-tests/catalog
    envVars:
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: hms-postgres
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: hms-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: hms-postgres
          property: password
      - key: APP_JWT_SECRET
        value: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

databases:
  - name: hms-postgres
    databaseName: hms_db
    user: hms_user
    plan: free
    region: singapore
