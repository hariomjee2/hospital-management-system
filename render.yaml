services:
  - type: web
    name: hms-backend
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /api/v1/users/profile-picture/00000000-0000-0000-0000-000000000000
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: hms-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: hms-postgres
          property: port
      - key: DB_NAME
        fromDatabase:
          name: hms-postgres
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: hms-postgres
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: hms-postgres
          property: password
      - key: APP_JWT_SECRET
        value: 5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437

databases:
  - name: hms-postgres
    databaseName: hms_db
    user: hms_user
    plan: free
    region: singapore
